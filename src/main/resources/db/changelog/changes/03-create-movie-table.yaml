databaseChangeLog:
  - changeSet:
      id: create-movie-table
      author: me
      changes:
        - createTable:
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: actors_id
                  type: bigint